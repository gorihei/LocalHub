<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>ToDoリスト</title>
<style>
  /* 色はテーマ変数(var(--xxx))任せだが、レイアウト・アニメーションは
     このプラグイン独自のもの。ホスト注入のベーススタイル(button/input)は
     あえて上書きして、「よくあるプレーンなフォーム」から離れた見た目にしている。
     variant="flush"でウィジェットカードに直接馴染む(枠なし)前提のデザイン。 */
  html, body { height: 100%; }
  body {
    padding: 0;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* 進捗バー: 完了率をひと目で示す、このウィジェットの「顔」になる部分。 */
  .progress-track {
    height: 4px;
    background: var(--border-soft, #212b3b);
    flex-shrink: 0;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent, #22d3ee), var(--accent-strong, #67e8f9));
    transition: width 320ms cubic-bezier(.22,1,.36,1);
    border-radius: 0 3px 3px 0;
  }

  .content { padding: 12px; display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; flex-shrink: 0; }
  .head .count { font-size: 11px; color: var(--text-faint, #6b7688); font-variant-numeric: tabular-nums; }
  .head .count b { color: var(--accent, #22d3ee); font-weight: 700; }

  .composer {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-raised, #172033);
    border: 1px solid var(--border, #2a3443);
    border-radius: 999px;
    padding: 4px 4px 4px 14px;
    margin-bottom: 12px;
    flex-shrink: 0;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .composer:focus-within {
    border-color: var(--accent, #22d3ee);
    box-shadow: 0 0 0 3px var(--accent-soft, rgba(34,211,238,.14));
  }
  .composer input {
    flex: 1;
    background: none;
    border: none;
    padding: 6px 0;
    font-size: 12.5px;
    color: var(--text, #f3f4f6);
    outline: none;
  }
  .composer input::placeholder { color: var(--text-faint, #6b7688); }
  .add-btn {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent, #22d3ee), var(--accent-strong, #67e8f9));
    color: #0b0f14;
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 120ms ease, opacity 120ms ease;
  }
  .add-btn:hover { transform: scale(1.08); }
  .add-btn:active { transform: scale(.94); }
  .add-btn:disabled { opacity: .35; cursor: default; transform: none; }

  .error { color: var(--danger, #f87171); font-size: 11.5px; margin-bottom: 8px; flex-shrink: 0; }

  .list { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px; }

  .item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 10px;
    border-radius: 10px;
    background: transparent;
    transition: background 150ms ease;
  }
  .item:hover { background: var(--surface-raised, #172033); }
  .item:hover .del { opacity: 1; }

  .check {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1.5px solid var(--text-faint, #6b7688);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    background: none;
    padding: 0;
  }
  .check svg { width: 10px; height: 10px; opacity: 0; transform: scale(.5); transition: opacity 150ms ease, transform 150ms ease; }
  .item.done .check {
    border-color: var(--accent, #22d3ee);
    background: linear-gradient(135deg, var(--accent, #22d3ee), var(--accent-strong, #67e8f9));
  }
  .item.done .check svg { opacity: 1; transform: scale(1); }

  .title {
    flex: 1;
    font-size: 12.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: color 200ms ease;
  }
  .item.done .title { color: var(--text-faint, #6b7688); text-decoration: line-through; }

  .del {
    opacity: 0;
    background: none;
    border: none;
    color: var(--text-faint, #6b7688);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 2px 4px;
    flex-shrink: 0;
    transition: opacity 120ms ease, color 120ms ease;
  }
  .del:hover { color: var(--danger, #f87171); }

  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--text-faint, #6b7688);
    font-size: 12px;
  }
  .empty .emoji { font-size: 26px; opacity: .8; }
</style>
</head>
<body>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="content">
    <div class="head">
      <span class="count" id="count"></span>
    </div>
    <div class="composer">
      <input type="text" id="draft" placeholder="新しいタスクを追加…" />
      <button class="add-btn" id="add">+</button>
    </div>
    <div id="error" class="error"></div>
    <div id="list" class="list"></div>
  </div>

  <script src="/__bridge.js"></script>
  <script>
    const listEl = document.getElementById("list");
    const draftEl = document.getElementById("draft");
    const errorEl = document.getElementById("error");
    const countEl = document.getElementById("count");
    const progressFillEl = document.getElementById("progressFill");
    const CHECK_SVG = '<svg viewBox="0 0 12 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 5L4.5 8.5L11 1.5" stroke="#0b0f14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    function render(todos) {
      const total = todos.length;
      const done = todos.filter((t) => t.done).length;
      countEl.innerHTML = total === 0 ? "" : `<b>${done}</b> / ${total} 完了`;
      progressFillEl.style.width = total === 0 ? "0%" : `${Math.round((done / total) * 100)}%`;

      listEl.innerHTML = "";
      if (total === 0) {
        listEl.innerHTML = '<div class="empty"><span class="emoji">✨</span>タスクはありません</div>';
        return;
      }
      todos
        .slice()
        .sort((a, b) => Number(a.done) - Number(b.done))
        .forEach((t) => {
          const row = document.createElement("div");
          row.className = "item" + (t.done ? " done" : "");

          const check = document.createElement("button");
          check.className = "check";
          check.innerHTML = CHECK_SVG;
          check.disabled = t.done;
          check.onclick = () => complete(t.id);

          const title = document.createElement("span");
          title.className = "title";
          title.textContent = t.title;
          title.title = t.title;

          const del = document.createElement("button");
          del.className = "del";
          del.textContent = "×";
          del.title = "削除";
          del.onclick = () => remove(t.id);

          row.append(check, title, del);
          listEl.appendChild(row);
        });
    }

    function refresh() {
      window.localhub
        .call("todo.list")
        .then(render)
        .catch((err) => (errorEl.textContent = String(err)));
    }

    function add() {
      const title = draftEl.value.trim();
      if (!title) return;
      window.localhub
        .call("todo.add", { title })
        .then(() => {
          draftEl.value = "";
          errorEl.textContent = "";
          refresh();
        })
        .catch((err) => (errorEl.textContent = String(err)));
    }

    function complete(id) {
      window.localhub.call("todo.complete", { id }).then(refresh).catch((err) => (errorEl.textContent = String(err)));
    }

    function remove(id) {
      window.localhub.call("todo.remove", { id }).then(refresh).catch((err) => (errorEl.textContent = String(err)));
    }

    document.getElementById("add").onclick = add;
    draftEl.addEventListener("keydown", (e) => e.key === "Enter" && add());
    refresh();
  </script>
</body>
</html>

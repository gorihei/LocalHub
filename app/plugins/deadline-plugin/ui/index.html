<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>締め切りトラッカー</title>
<style>
  html, body { height: 100%; }
  body { padding: 12px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }

  .composer {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-raised, #172033);
    border: 1px solid var(--border, #2a3443);
    border-radius: 999px;
    padding: 4px 4px 4px 14px;
    margin-bottom: 10px;
    flex-shrink: 0;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .composer:focus-within { border-color: var(--accent, #22d3ee); box-shadow: 0 0 0 3px var(--accent-soft, rgba(34,211,238,.14)); }
  .composer input { background: none; border: none; padding: 6px 0; font-size: 12px; color: var(--text, #f3f4f6); outline: none; }
  .composer input#title { flex: 1; min-width: 0; }
  .composer input#dueAt { width: 128px; flex-shrink: 0; }
  .add-btn {
    width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--accent, #22d3ee), var(--accent-strong, #67e8f9));
    color: #0b0f14; font-size: 16px; font-weight: 700; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform 120ms ease;
  }
  .add-btn:hover { transform: scale(1.08); }
  .add-btn:disabled { opacity: .35; cursor: default; transform: none; }

  .error { color: var(--danger, #f87171); font-size: 11.5px; margin-bottom: 8px; flex-shrink: 0; }

  .list { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 4px; padding-bottom: 4px; }
  .item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; transition: background 150ms ease; }
  .item:hover { background: var(--surface-raised, #172033); }
  .item:hover .del { opacity: 1; }
  .item .title { flex: 1; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .badge { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .item .badge.overdue { background: var(--danger-soft, rgba(248,113,113,.14)); color: var(--danger, #f87171); }
  .item .badge.urgent { background: var(--warning-soft, rgba(251,191,36,.14)); color: var(--warning, #fbbf24); }
  .item .badge.normal { background: var(--surface-hover, #1c2740); color: var(--text-muted, #9ca3af); }
  .item .badge.today { background: var(--accent-soft, rgba(34,211,238,.14)); color: var(--accent, #22d3ee); }
  .item .del { opacity: 0; background: none; border: none; color: var(--text-faint, #6b7688); cursor: pointer; font-size: 14px; padding: 2px 4px; transition: opacity 120ms ease, color 120ms ease; }
  .item .del:hover { color: var(--danger, #f87171); }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-faint, #6b7688); font-size: 12px; }
  .empty .emoji { font-size: 26px; opacity: .8; }
</style>
</head>
<body>
  <div class="composer">
    <input type="text" id="title" placeholder="締め切りの名前…" />
    <input type="date" id="dueAt" />
    <button class="add-btn" id="add">+</button>
  </div>
  <div id="error" class="error"></div>
  <div id="list" class="list"></div>

  <script src="/__bridge.js"></script>
  <script>
    const listEl = document.getElementById("list");
    const titleEl = document.getElementById("title");
    const dueAtEl = document.getElementById("dueAt");
    const errorEl = document.getElementById("error");

    function daysRemaining(dueAt) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const due = new Date(dueAt + "T00:00:00");
      return Math.round((due - today) / 86400000);
    }

    function badgeFor(days) {
      if (days < 0) return { cls: "overdue", text: `${-days}日超過` };
      if (days === 0) return { cls: "today", text: "今日" };
      if (days <= 3) return { cls: "urgent", text: `あと${days}日` };
      return { cls: "normal", text: `あと${days}日` };
    }

    function render(items) {
      listEl.innerHTML = "";
      if (items.length === 0) {
        listEl.innerHTML = '<div class="empty"><span class="emoji">🗓️</span>締め切りはありません</div>';
        return;
      }
      items
        .slice()
        .sort((a, b) => a.dueAt.localeCompare(b.dueAt))
        .forEach((item) => {
          const days = daysRemaining(item.dueAt);
          const badge = badgeFor(days);
          const row = document.createElement("div");
          row.className = "item";

          const title = document.createElement("span");
          title.className = "title";
          title.textContent = item.title;
          title.title = `${item.title}(${item.dueAt})`;

          const badgeEl = document.createElement("span");
          badgeEl.className = "badge " + badge.cls;
          badgeEl.textContent = badge.text;

          const del = document.createElement("button");
          del.className = "del";
          del.textContent = "×";
          del.title = "削除";
          del.onclick = () => remove(item.id);

          row.append(title, badgeEl, del);
          listEl.appendChild(row);
        });
    }

    function refresh() {
      window.localhub
        .call("deadline.list")
        .then(render)
        .catch((err) => (errorEl.textContent = String(err)));
    }

    function add() {
      const title = titleEl.value.trim();
      const dueAt = dueAtEl.value;
      if (!title || !dueAt) return;
      window.localhub
        .call("deadline.add", { title, dueAt })
        .then((items) => {
          titleEl.value = "";
          errorEl.textContent = "";
          render(items);
        })
        .catch((err) => (errorEl.textContent = String(err)));
    }

    function remove(id) {
      window.localhub.call("deadline.remove", { id }).then(render).catch((err) => (errorEl.textContent = String(err)));
    }

    document.getElementById("add").onclick = add;
    titleEl.addEventListener("keydown", (e) => e.key === "Enter" && add());
    refresh();
  </script>
</body>
</html>

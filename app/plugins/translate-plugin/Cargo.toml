[package]
name = "translate-plugin"
version = "0.1.0"
edition = "2021"
description = "DeepL API Freeを利用する翻訳プラグイン"

[[bin]]
name = "translate-plugin"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }


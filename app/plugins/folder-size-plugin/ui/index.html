<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>フォルダサイズ集計</title>
<style>
  /* todo-pluginと同じデザイン言語(ピル型入力・グラデーションの丸ボタン・
     ホバーで浮くカード風の行)に揃えている。色はテーマ変数に追従する。 */
  html, body { height: 100%; }
  body { padding: 12px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }

  .composer {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-raised, #172033);
    border: 1px solid var(--border, #2a3443);
    border-radius: 999px;
    padding: 4px 4px 4px 14px;
    margin-bottom: 10px;
    flex-shrink: 0;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .composer:focus-within {
    border-color: var(--accent, #22d3ee);
    box-shadow: 0 0 0 3px var(--accent-soft, rgba(34,211,238,.14));
  }
  .composer input {
    flex: 1;
    background: none;
    border: none;
    padding: 6px 0;
    font-size: 12px;
    font-family: var(--font-mono, monospace);
    color: var(--text, #f3f4f6);
    outline: none;
    min-width: 0;
  }
  .composer input::placeholder { color: var(--text-faint, #6b7688); }

  .round-btn {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: var(--surface-hover, #1c2740);
    color: var(--text, #f3f4f6);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 120ms ease, background 120ms ease;
  }
  .round-btn:hover { transform: scale(1.08); background: var(--border, #2a3443); }
  .round-btn:active { transform: scale(.94); }

  .scan-btn {
    background: linear-gradient(135deg, var(--accent, #22d3ee), var(--accent-strong, #67e8f9));
    color: #0b0f14;
    font-weight: 700;
  }
  .scan-btn:hover { background: linear-gradient(135deg, var(--accent, #22d3ee), var(--accent-strong, #67e8f9)); }
  .scan-btn:disabled { opacity: .4; cursor: default; transform: none; }

  .error { color: var(--danger, #f87171); font-size: 11.5px; margin-bottom: 8px; flex-shrink: 0; }

  .total {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .total .value { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, var(--accent, #22d3ee), var(--accent-strong, #67e8f9)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .total .label { font-size: 11px; color: var(--text-faint, #6b7688); }
  .total .warn { font-size: 10.5px; color: var(--warning, #fbbf24); margin-left: auto; }

  .entries { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 3px; padding-bottom: 4px; }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 8px;
    overflow: hidden;
    transition: background 150ms ease;
  }
  .row:hover { background: var(--surface-raised, #172033); }
  /* 各行の背景に、全体に対する相対的な容量比を薄いバーとして敷く。
     数字を読まなくても直感的に「どれが重いか」が分かる、このウィジェット独自の演出。 */
  .row .bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    background: var(--accent-soft, rgba(34,211,238,.14));
    border-radius: 8px;
    z-index: 0;
    transition: width 400ms cubic-bezier(.22,1,.36,1);
  }
  .row .icon, .row .name, .row .bytes { position: relative; z-index: 1; }
  .row .icon { flex-shrink: 0; font-size: 12px; }
  .row .name { flex: 1; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .bytes { flex-shrink: 0; font-size: 11px; font-family: var(--font-mono, monospace); color: var(--text-muted, #9ca3af); }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-faint, #6b7688); font-size: 12px; }
  .empty .emoji { font-size: 26px; opacity: .8; }
</style>
</head>
<body>
  <div class="composer">
    <input type="text" id="path" placeholder="C:\Users\..." />
    <button class="round-btn" id="pick" title="フォルダ選択">📁</button>
    <button class="round-btn scan-btn" id="scan" title="集計">→</button>
  </div>
  <div id="error" class="error"></div>
  <div id="total"></div>
  <div id="entries" class="entries">
    <div class="empty"><span class="emoji">📂</span>フォルダを選んで集計してください</div>
  </div>

  <script src="/__bridge.js"></script>
  <script>
    const pathEl = document.getElementById("path");
    const errorEl = document.getElementById("error");
    const totalEl = document.getElementById("total");
    const entriesEl = document.getElementById("entries");
    const scanBtn = document.getElementById("scan");
    const pickBtn = document.getElementById("pick");

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function scan() {
      const path = pathEl.value.trim();
      if (!path) return;
      scanBtn.disabled = true;
      scanBtn.textContent = "…";
      errorEl.textContent = "";
      window.localhub
        .call("size.scan", { path, topN: 30 })
        .then((r) => {
          totalEl.innerHTML = `<span class="value">${r.totalBytesFormatted}</span><span class="label">合計</span>${
            r.truncated ? '<span class="warn">一部のみ走査</span>' : ""
          }`;
          if (r.entries.length === 0) {
            entriesEl.innerHTML = '<div class="empty"><span class="emoji">✨</span>空のフォルダです</div>';
            return;
          }
          const max = Math.max(...r.entries.map((e) => e.bytes), 1);
          let html = "";
          for (const e of r.entries) {
            const pct = Math.max(2, Math.round((e.bytes / max) * 100));
            html += `<div class="row"><div class="bar" style="width:${pct}%"></div><span class="icon">${e.isDir ? "📁" : "📄"}</span><span class="name" title="${escapeHtml(e.name)}">${escapeHtml(e.name)}</span><span class="bytes">${e.bytesFormatted}</span></div>`;
          }
          entriesEl.innerHTML = html;
        })
        .catch((err) => {
          errorEl.textContent = String(err);
          totalEl.innerHTML = "";
          entriesEl.innerHTML = "";
        })
        .finally(() => {
          scanBtn.disabled = false;
          scanBtn.textContent = "→";
        });
    }

    pickBtn.onclick = () => {
      window.localhub.pickFolder().then((dir) => {
        if (dir) {
          pathEl.value = dir;
          scan();
        }
      });
    };
    scanBtn.onclick = scan;
    pathEl.addEventListener("keydown", (e) => e.key === "Enter" && scan());
  </script>
</body>
</html>

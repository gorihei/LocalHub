<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>ネットワーク疎通確認</title>
<style>
  /* todo-plugin/folder-size-pluginと同じデザイン言語(ピル型入力・グラデーションの
     丸ボタン・ホバーで浮くカード風の行)に揃えている。色はテーマ変数に追従する。 */
  html, body { height: 100%; }
  body { padding: 12px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; }

  .composer {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-raised, #172033);
    border: 1px solid var(--border, #2a3443);
    border-radius: 999px;
    padding: 4px 4px 4px 14px;
    margin-bottom: 10px;
    flex-shrink: 0;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .composer:focus-within {
    border-color: var(--accent, #22d3ee);
    box-shadow: 0 0 0 3px var(--accent-soft, rgba(34,211,238,.14));
  }
  .composer input {
    background: none;
    border: none;
    padding: 6px 0;
    font-size: 12px;
    color: var(--text, #f3f4f6);
    outline: none;
    min-width: 0;
  }
  .composer input#host { flex: 1; font-family: var(--font-mono, monospace); }
  .composer input#port { width: 44px; text-align: right; font-family: var(--font-mono, monospace); }
  .composer input::placeholder { color: var(--text-faint, #6b7688); }
  .composer .sep { color: var(--text-faint, #6b7688); font-size: 11px; }

  .round-btn {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent, #22d3ee), var(--accent-strong, #67e8f9));
    color: #0b0f14;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 120ms ease, opacity 120ms ease;
  }
  .round-btn:hover { transform: scale(1.08); }
  .round-btn:active { transform: scale(.94); }
  .round-btn:disabled { opacity: .4; cursor: default; transform: none; }

  .error { color: var(--danger, #f87171); font-size: 11.5px; margin-bottom: 8px; flex-shrink: 0; }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-shrink: 0;
    min-height: 20px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; transition: background 200ms ease, box-shadow 200ms ease; }
  .dot.ok { background: var(--success, #34d399); box-shadow: 0 0 8px var(--success, #34d399); }
  .dot.ng { background: var(--danger, #f87171); box-shadow: 0 0 8px var(--danger, #f87171); }
  .dot.pending { background: var(--text-faint, #6b7688); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .status .text { font-size: 12.5px; }
  .status .ms { font-size: 11px; color: var(--text-faint, #6b7688); font-family: var(--font-mono, monospace); }

  .history { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 3px; padding-bottom: 4px; }
  .h-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    border-radius: 8px;
    border-left: 2px solid transparent;
    font-size: 11px;
    transition: background 150ms ease;
  }
  .h-row:hover { background: var(--surface-raised, #172033); }
  .h-row.ok { border-left-color: var(--success, #34d399); }
  .h-row.ng { border-left-color: var(--danger, #f87171); }
  .h-row .time { color: var(--text-faint, #6b7688); font-family: var(--font-mono, monospace); flex-shrink: 0; }
  .h-row .target { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-mono, monospace); }
  .h-row .ms { color: var(--text-muted, #9ca3af); flex-shrink: 0; }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-faint, #6b7688); font-size: 12px; }
  .empty .emoji { font-size: 26px; opacity: .8; }
</style>
</head>
<body>
  <div class="composer">
    <input type="text" id="host" placeholder="例: google.com" />
    <span class="sep">:</span>
    <input type="number" id="port" value="443" />
    <button class="round-btn" id="check" title="接続確認">→</button>
  </div>
  <div id="error" class="error"></div>
  <div id="status" class="status"></div>
  <div id="history" class="history">
    <div class="empty"><span class="emoji">📡</span>まだ確認していません</div>
  </div>

  <script src="/__bridge.js"></script>
  <script>
    const hostEl = document.getElementById("host");
    const portEl = document.getElementById("port");
    const errorEl = document.getElementById("error");
    const statusEl = document.getElementById("status");
    const historyEl = document.getElementById("history");
    const checkBtn = document.getElementById("check");
    const log = [];

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function check() {
      const host = hostEl.value.trim();
      if (!host) return;
      const port = Number(portEl.value) || 443;
      checkBtn.disabled = true;
      errorEl.textContent = "";
      statusEl.innerHTML = '<span class="dot pending"></span><span class="text">確認中…</span>';
      window.localhub
        .call("ping.check", { host, port })
        .then((r) => {
          const ok = r.reachable;
          statusEl.innerHTML = ok
            ? `<span class="dot ok"></span><span class="text">接続できました</span><span class="ms">${r.latencyMs}ms</span>`
            : `<span class="dot ng"></span><span class="text">接続できません</span>`;
          const time = new Date().toLocaleTimeString("ja-JP");
          log.unshift({ ok, time, target: `${host}:${port}`, ms: ok ? `${r.latencyMs}ms` : "—" });
          historyEl.innerHTML = log
            .slice(0, 30)
            .map(
              (h) =>
                `<div class="h-row ${h.ok ? "ok" : "ng"}"><span class="time">${h.time}</span><span class="target">${escapeHtml(h.target)}</span><span class="ms">${h.ms}</span></div>`
            )
            .join("");
        })
        .catch((err) => {
          errorEl.textContent = String(err);
          statusEl.innerHTML = "";
        })
        .finally(() => {
          checkBtn.disabled = false;
        });
    }

    checkBtn.onclick = check;
    hostEl.addEventListener("keydown", (e) => e.key === "Enter" && check());
    portEl.addEventListener("keydown", (e) => e.key === "Enter" && check());
  </script>
</body>
</html>

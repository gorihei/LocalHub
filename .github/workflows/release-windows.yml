name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows installers
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          $tauriVersion = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (
            Select-String -Path app/src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' |
              Select-Object -First 1
          ).Matches.Groups[1].Value

          $versions = @{
            tag = $tagVersion
            tauri = $tauriVersion
            package = $packageVersion
            cargo = $cargoVersion
          }
          $versions.GetEnumerator() | Sort-Object Name | Format-Table -AutoSize

          if ($versions.Values | Where-Object { $_ -ne $tagVersion }) {
            throw "タグとtauri.conf.json、package.json、Cargo.tomlのバージョンが一致していません。"
          }

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build installers and create GitHub Release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Local Hub ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles nsis,msi

